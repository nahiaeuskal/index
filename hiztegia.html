<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiztegia</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3ff;--card:#ffffff;--ink:#14213d;--mut:#5b6b8c;--sun:#ffc93c;--mint:#1fb5a5;--ok:#12805c;--okbg:#d8f5e8;--bad:#c92a4b;--badbg:#ffe1e7;--key:#dbe9ff;--line:#c4d6f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a30;--card:#1a2744;--ink:#f2f6ff;--mut:#a3b3d6;--sun:#ffd25e;--mint:#3fd6c5;--ok:#6ee7b0;--okbg:#14382f;--bad:#ff8aa1;--badbg:#42202a;--key:#26375d;--line:#33466f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a30;--card:#1a2744;--ink:#f2f6ff;--mut:#a3b3d6;--sun:#ffd25e;--mint:#3fd6c5;--ok:#6ee7b0;--okbg:#14382f;--bad:#ff8aa1;--badbg:#42202a;--key:#26375d;--line:#33466f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;min-height:100%}
main{max-width:480px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 8px;text-align:center}
.legend{text-align:center;color:var(--mut);margin:0 0 12px;font-size:1rem}
.path{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);font:800 1.1rem "Baloo 2",system-ui,sans-serif;cursor:pointer}
.dot[disabled]{opacity:.45;cursor:not-allowed}
.dot.on{background:var(--sun);border-color:var(--ink);color:#14213d}
.dot.done{border-color:var(--mint)}
.card{background:var(--card);border-radius:22px;padding:20px 16px;border:2px solid var(--line)}
.meta{display:flex;justify-content:space-between;color:var(--mut)}
.bar{height:10px;background:var(--key);border-radius:9px;margin:8px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.task{text-align:center;font-size:1.25rem;color:var(--mut);margin:0 0 12px}
.big{font-size:3.4rem;font-weight:800;text-align:center;line-height:1.15;margin-bottom:6px}
.tag{display:inline-block;background:var(--sun);color:#14213d;border-radius:12px;padding:2px 14px;font-weight:800;font-size:1.4rem}
.hint{text-align:center;color:var(--mut);margin:6px 0 12px}
.word{text-align:center;font-size:1.8rem;font-weight:800;margin-bottom:4px}
.sent{font-size:1.8rem;font-weight:800;text-align:center;line-height:1.3;margin:8px 0 16px}
.cue{text-align:center;font-size:2.2rem;letter-spacing:4px;margin:0 0 4px}
.lab{text-align:center;color:var(--mut);margin:6px 0 4px}
.grp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.inp2{font-size:1.6rem;margin-bottom:6px}
.ex{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--key);text-align:left;font-size:1.05rem;line-height:1.35}
.ex .b{font-weight:800}
.ex .es{color:var(--mut);font-style:italic;margin-top:2px}
.sent b{background:var(--sun);color:#14213d;border-radius:8px;padding:0 8px}
input{width:100%;font:800 1.9rem "Baloo 2",system-ui,sans-serif;text-align:center;padding:10px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink)}
input.ok{border-color:var(--ok);color:var(--ok)}
input.bad{border-color:var(--bad);color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>div,.opts{display:flex;flex-direction:column;gap:10px}
.chip{font:800 1.3rem "Baloo 2",system-ui,sans-serif;padding:12px 8px;border-radius:14px;border:3px solid var(--line);background:var(--key);color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--ink);background:var(--sun);color:#14213d}
.chip.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{min-height:32px;text-align:center;font-size:1.2rem;font-weight:700;margin:12px 0 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.go{display:block;width:100%;margin-top:12px;font:800 1.4rem "Baloo 2",system-ui,sans-serif;border:0;border-radius:16px;padding:12px 0;background:var(--sun);color:#14213d;cursor:pointer}
.go.sec{background:var(--key);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--mint);outline-offset:2px}
.end{text-align:center}
.stars{font-size:2.6rem;letter-spacing:6px}
.end p{font-size:1.2rem;margin:8px 0 16px}
[hidden]{display:none!important}
.back{display:inline-block;margin:0 0 8px;color:var(--mut);font:700 1rem "Baloo 2",system-ui,sans-serif;text-decoration:none}
.back:hover{color:var(--ink)}

.sub{text-align:center;color:var(--mut);font-size:1.2rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center;cursor:pointer;color:var(--ink);font:800 1.05rem "Baloo 2",system-ui,sans-serif;line-height:1.15}
.tcard:hover,.tcard:focus-visible{border-color:var(--sun)}
.tcard .ti{display:block;font-size:2rem;margin-bottom:2px}
.tcard .ts{display:block;color:var(--mint);letter-spacing:3px;font-size:1rem;min-height:1.4em}
.mini{background:var(--key);color:var(--ink);border:0;border-radius:12px;padding:4px 12px;font:700 1rem "Baloo 2",system-ui,sans-serif;cursor:pointer}
.big2{font-size:2.3rem;font-weight:800;text-align:center;line-height:1.2;margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px;padding:8px;border-radius:14px}
#slots{border:3px dashed var(--line);margin-bottom:12px}
.letter{min-width:46px;font-size:1.5rem;padding:8px 10px}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← Hasiera</a>
<h1>Hiztegia</h1>
<section id="home">
  <p class="sub">Aukeratu gai bat</p>
  <div class="grid" id="grid"></div>
</section>
<section class="card" id="play" hidden>
  <div class="meta"><button class="mini" id="tb">← Gaiak</button><span id="count"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="stage"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="ex" id="ex" hidden></div>
  <button class="go" id="go">Egiaztatu</button>
</section>
<section class="card end" id="end" hidden>
  <div class="stars" id="stars"></div>
  <h2 id="etitle"></h2>
  <p id="etext"></p>
  <button class="go" id="again">Errepikatu</button>
  <button class="go sec" id="back">Beste gai bat</button>
</section>
</main>

"Irakurri", "Leer"], ["Esan", "Decir"], ["Sartu", "Entrar"], ["Irten", "Salir"], ["Hartu", "Coger / Tomar"], ["Eman", "Dar"], ["Eraman", "Llevar"], ["Jantzi", "Vestirse / Ponerse ropa"], ["Jolastu", "Jugar"], ["Lan egin", "Trabajar"], ["Gosaldu", "Desayunar"], ["Afaldu", "Cenar"], ["Lo egin", "Dormir"], ["Esnatu", "Despertarse"], ["Garbitu", "Limpiar / Lavarse"], ["Itxi", "Cerrar"], ["Ireki", "Abrir"], ["Saldu", "Vender"], ["Ordaindu", "Pagar"], ["Agurtu", "Saludar / Despedirse"], ["Dantzatu", "Bailar"], ["Jaitsi", "Bajar"], ["Igo", "Subir"], ["Jarri", "Poner / Ponerse"], ["Ezkondu", "Casarse"], ["Galdetu", "Preguntar"], ["Bete", "Llenar / Completar"], ["Osatu", "Completar"], ["Azaldu", "Explicar"], ["Entregatu", "Entregar"]]}, {"id": "t9", "n": "Beste hitz erabilgarriak", "i": "🧩", "e": [["Etxe", "Casa"], ["Leiho", "Ventana"], ["Ate", "Puerta"], ["Auto", "Coche"], ["Tren", "Tren"], ["Bagoia", "Vagón"], ["Txakurra", "Perro"], ["Katua", "Gato"], ["Begiak", "Ojos"], ["Ilea", "Pelo"], ["Prakak", "Pantalones"], ["Arropa", "Ropa"], ["Mahaia", "Mesa"], ["Egunkaria", "Periódico"], ["Irratia", "Radio"], ["Bideoa", "Vídeo"], ["Diskoa", "Disco"], ["Paketea", "Paquete"], ["Sagarra", "Manzana"], ["Bizkotxoa", "Bizcocho"], ["Afaria", "Cena"], ["Ariketa", "Ejercicio"], ["Gezurra", "Mentira"], ["Egia", "Verdad"], ["Urtea", "Año"], ["Adiskidea", "Amigo/a"], ["Laguna", "Amigo/a"], ["Ikastaroa", "Curso"], ["Sukaldaritza", "Cocina"], ["Izen-abizenak", "Nombre y apellidos"], ["Zenbakia", "Número"], ["Eskuina", "Derecha"], ["Ezkerra", "Izquierda"], ["Pisua", "Piso / Planta"], ["Goiza", "Mañana"], ["Arratsaldea", "Tarde"], ["Gaua", "Noche"], ["Ederto", "Perfecto / Estupendo"], ["Arin", "Rápido"], ["Lehenengo", "Primero"], ["Hurrengo", "Siguiente"], ["Bezala", "Como"], ["Bakarra", "Único/a / Solo/a"]]}];
var SPEC=[{id:"mix",n:"Guztiak nahastuta",i:"🎲"},{id:"dago",n:"Da ala dago?",i:"🔀"}];
var ALL=[];TOPICS.forEach(function(t){t.e.forEach(function(x){ALL.push(x)})});

function valid(eu,es){return ALL.some(function(x){return x[0]===eu&&x[1]===es})}

var cur=null,POOL=[],qE=[],ie=0,qi=0,hits=0,checked=false,chk=null;

function home(){
  $("home").hidden=false;$("play").hidden=true;$("end").hidden=true;
  var g=$("grid");g.innerHTML="";
  TOPICS.concat(SPEC).forEach(function(t){
    var b=document.createElement("button");b.className="tcard";
    var st=save.stars[t.id]||0;
    b.innerHTML='<span class="ti">'+t.i+'</span>'+t.n+'<span class="ts">'+(st?"★".repeat(st)+"☆".repeat(3-st):"")+'</span>';

    g.appendChild(b);
  });

function startTopic(t){
  cur=t;qi=0;hits=0;
  POOL=t.id==="mix"?ALL.slice():t.id==="dago"?[]:t.e.slice();
  qE=shuf(POOL.slice());ie=0;
  $("home").hidden=true;$("play").hidden=false;$("end").hidden=true;
  ask();
}
function ne(f){
  if(!qE.length)return null;
  for(var k=0;k<qE.length*2;k++){var e=qE[ie++%qE.length];if(!f||f(e))return e}
  return qE[ie++%qE.length];
}
function setFb(t,c){var f=$("fb");f.textContent=t;f.className="fb"+(c?" "+c:"")}
function ask(){
  checked=false;chk=null;setFb("","");$("ex").hidden=true;$("ex").innerHTML="";
  $("count").textContent=(qi+1)+" / "+TOTAL;
  $("bar").style.width=(qi/TOTAL*100)+"%";
  var t=(cur.id==="dago"?DSEQ:SEQ)[qi];
  ({match:matchEx,eu2es:eu2es,es2eu:es2eu,scr:scr,tf:tf,write:wr,ddf:ddf,ddq:ddq})[t]();
  var g=$("go");g.textContent="Egiaztatu";g.hidden=!SHOWGO[t];
}
function done(ok,msg,html){
  if(checked)return;checked=true;if(ok)hits++;
  setFb(msg,ok?"ok":"bad");
  if(html){var e=$("ex");e.innerHTML=html;e.hidden=false}
  var g=$("go");g.hidden=false;g.textContent=qi+1>=TOTAL?"Emaitza ikusi":"Hurrengoa";
  $("bar").style.width=((qi+1)/TOTAL*100)+"%";
}
function go(){
  if(checked){qi++;qi>=TOTAL?finish():ask()}
  else if(chk)chk();
}
function mkOpts(list,ans,wmsg,hOk,hBad){
  var o=$("opts");
  list.forEach(function(t){
    var b=document.createElement("button");b.className="chip";b.textContent=t;
    b.onclick=function(){
      if(checked)return;
      var ok=t===ans;b.className="chip "+(ok?"good":"wrong");
      if(!ok)Array.prototype.forEach.call(o.children,function(k,i){if(list[i]===ans)k.className="chip good"});
      done(ok,ok?"Oso ondo!":wmsg,ok?hOk:hBad);
    };
    o.appendChild(b);
  });
}
function dist(e,n,key){
  var out=[],seen={};seen[e[key]]=1;
  var cand=shuf(POOL.slice()).concat(shuf(ALL.slice()));
  for(var i=0;i<cand.length&&out.length<n;i++){
    var c=cand[i];
    if(c[0]===e[0]||c[1]===e[1]||seen[c[key]])continue;
    if(key===1&&valid(e[0],c[1]))continue;
    if(key===0&&valid(c[0],e[1]))continue;
    seen[c[key]]=1;out.push(c[key]);
  }
  return out;
}

var SC=/^[A-Za-zñÑ]{4,11}$/;
function scr(){
  var e=ne(function(x){return SC.test(x[0])});

  var w=e[0].toLowerCase(),pool=[],ans=[];
  var L=w.split("").map(function(c,i){return{c:c,i:i}});
  pool=shuf(L.slice());
  for(var k=0;k<5&&pool.map(function(x){return x.c}).join("")===w;k++)pool=shuf(L.slice());
  $("stage").innerHTML='<p class="task">Ordenatu letrak</p><div class="big2">'+e[1]+'</div><div class="row" id="slots"></div><div class="row" id="pool"></div>';

  }
  draw();
  chk=function(){

    var ok=ans.map(function(x){return x.c}).join("")===w;

  };
}

function matchEx(){
  var items=[],ue={},us={},tries=0;
  while(items.length<4&&tries<80){
    tries++;var e=ne();if(!e)break;
    if(ue[e[0]]||us[e[1]])continue;
    ue[e[0]]=1;us[e[1]]=1;items.push({l:e[0],f:e[1]});
  }
  var extra=shuf(ALL.slice());
  for(var j=0;items.length<4&&j<extra.length;j++){var x=extra[j];if(ue[x[0]]||us[x[1]])continue;ue[x[0]]=1;us[x[1]]=1;items.push({l:x[0],f:x[1]})}
  var right=shuf([0,1,2,3]);
  var pairs=items.map(function(it){return it.l+" = "+it.f}).join("<br>");
  $("stage").innerHTML='<p class="task">Lotu hitz bakoitza bere itzulpenarekin</p><div class="cols"><div id="cl"></div><div id="cr"></div></div>';
  var sl=null,sr=null,rest=4,bad=0,flash=false,bl={},br={};
  function mk(i,side,txt){
    var b=document.createElement("button");b.className="chip";b.textContent=txt;
    b.onclick=function(){
      if(b.disabled||flash||checked)return;
      if(side==="l"){if(sl!==null)bl[sl].classList.remove("sel");sl=i}
      else{if(sr!==null)br[sr].classList.remove("sel");sr=i}
      b.classList.add("sel");
      if(sl!==null&&sr!==null){
        var x=bl[sl],y=br[sr];
        if(sl===sr){
          x.className=y.className="chip good";x.disabled=y.disabled=true;rest--;
          if(!rest){
            if(bad<=1)done(true,bad?"Ia-ia! Akats bat.":"Oso ondo!",'<div class="es">'+pairs+'</div>');
            else done(false,"Akats gehiegi. Errepasatu hitz hauek.",'<div class="es">'+pairs+'</div>');
          }
        }else{
          bad++;flash=true;x.classList.add("wrong");y.classList.add("wrong");
          setTimeout(function(){x.className=y.className="chip";flash=false},550);
        }
        sl=sr=null;
      }
    };
    (side==="l"?bl:br)[i]=b;$(side==="l"?"cl":"cr").appendChild(b);
  }
  items.forEach(function(it,i){mk(i,"l",it.l)});
  right.forEach(function(i){mk(i,"r",items[i].f)});
}
